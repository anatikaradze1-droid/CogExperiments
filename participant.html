<!doctype html>
<html lang="ka">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Participant Information | CogExperiments</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #faf9f6;
      color: #1e1e1e;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .site-header {
      width: 100%;
      min-height: 72px;
      padding: 0 6vw;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(250, 249, 246, .97);
      border-bottom: 1px solid #e9e6df;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .site-header nav {
      display: flex;
      gap: 28px;
    }

    .site-header nav a {
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .site-header nav a:hover {
      color: #111;
    }

    .page {
      width: 100%;
      padding: 72px 20px 100px;
    }

    .shell {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 36px;

      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #111;
    }

    .eyebrow {
      margin-bottom: 12px;

      color: #777;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    h1 {
      margin: 0 0 14px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(38px, 6vw, 58px);
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: -1.5px;
    }

    .intro {
      max-width: 650px;
      margin: 0 0 38px;

      color: #666;
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .form-card {
      padding: 34px;

      background: #fff;
      border: 1px solid #e7e3dc;
      border-radius: 22px;

      box-shadow:
        0 12px 34px rgba(0, 0, 0, .035);
    }

    .study-block {
      padding-bottom: 24px;
      margin-bottom: 28px;

      border-bottom: 1px solid #ece8e1;
    }

    .study-label {
      margin-bottom: 8px;

      color: #888;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
    }

    .study-block h2 {
      margin: 0;

      font-size: 21px;
      font-weight: 650;
    }

    .question {
      margin-bottom: 28px;
    }

    .question-label {
      display: block;
      margin-bottom: 10px;

      color: #2e2e2e;
      font-size: 15px;
      line-height: 1.5;
      font-weight: 600;
    }

    .required {
      margin-left: 3px;
      color: #a33a3a;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 13px 14px;

      border: 1px solid #d9d5cd;
      border-radius: 11px;

      background: #fff;
      color: #222;

      font: inherit;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #9c978e;

      box-shadow:
        0 0 0 3px rgba(0, 0, 0, .04);
    }

    .choice-list {
      display: grid;
      gap: 10px;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 11px;

      padding: 13px 14px;

      border: 1px solid #e2ded6;
      border-radius: 11px;

      background: #fcfbf8;
      cursor: pointer;
    }

    .choice:hover {
      border-color: #cbc6bc;
    }

    .choice input {
      width: 17px;
      height: 17px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .choice span {
      color: #333;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      display: none;

      margin-top: 9px;

      color: #a33a3a;
      font-size: 13px;
    }

    .question.invalid .error {
      display: block;
    }

    .question.invalid input[type="text"],
    .question.invalid input[type="number"],
    .question.invalid select {
      border-color: #c98282;
    }

    .actions {
      margin-top: 36px;
      padding-top: 28px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;

      border-top: 1px solid #ece8e1;
    }

    .leave-link {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }

    .continue-btn {
      border: 0;
      border-radius: 999px;

      padding: 14px 24px;

      background: #202020;
      color: #fff;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .continue-btn:hover {
      background: #000;
    }

    .loading,
    .page-error {
      width: min(760px, 100%);
      margin: 100px auto;
      padding: 28px;

      background: #fff;
      border: 1px solid #e7e3dc;
      border-radius: 16px;

      line-height: 1.6;
    }

    @media (max-width: 650px) {

      .site-header {
        padding: 0 20px;
      }

      .site-header nav {
        gap: 14px;
      }

      .page {
        padding-top: 45px;
      }

      .form-card {
        padding: 22px;
      }

      .actions {
        flex-direction: column-reverse;
        align-items: stretch;
      }

      .continue-btn {
        width: 100%;
      }

      .leave-link {
        text-align: center;
      }
    }
  </style>
</head>


<body>

  <header class="site-header">

    <a
      class="brand"
      href="index.html">
      CogExperiments
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="research.html">Research</a>
    </nav>

  </header>


  <main id="participantApp">

    <div class="loading">
      იტვირთება...
    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/config.js?v=1.0.8"></script>
  <script src="assets/db.js?v=1.0.8"></script>


  <script>
    (() => {

      const app =
        document.getElementById(
          'participantApp'
        );


      const slug =
        new URLSearchParams(
          location.search
        ).get('exp');


      const esc = value =>
        String(value ?? '')
          .replace(
            /[&<>"']/g,
            char => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            }[char])
          );


      function renderQuestion(
        question,
        index
      ) {

        const requiredMark =
          question.required
            ? '<span class="required">*</span>'
            : '';


        if (
          question.type ===
          'number'
        ) {

          return `
            <div
              class="question"
              data-question-index="${index}">

              <label
                class="question-label"
                for="question_${index}">

                ${esc(question.label)}
                ${requiredMark}

              </label>

              <input
                id="question_${index}"
                type="number"
                data-question-input="${index}"
                placeholder="${esc(
                  question.placeholder ||
                  ''
                )}">

              <div class="error">
                გთხოვთ, შეავსოთ ეს ველი.
              </div>

            </div>
          `;
        }


        if (
          question.type ===
          'single_choice'
        ) {

          const options =
            Array.isArray(
              question.options
            )
              ? question.options
              : [];


          return `
            <div
              class="question"
              data-question-index="${index}">

              <div class="question-label">

                ${esc(question.label)}
                ${requiredMark}

              </div>

              <div class="choice-list">

                ${options
                  .map(
                    option => `
                      <label class="choice">

                        <input
                          type="radio"
                          name="question_${index}"
                          value="${esc(option)}"
                          data-question-input="${index}">

                        <span>
                          ${esc(option)}
                        </span>

                      </label>
                    `
                  )
                  .join('')}

              </div>

              <div class="error">
                გთხოვთ, აირჩიოთ პასუხი.
              </div>

            </div>
          `;
        }


        if (
          question.type ===
          'multiple_choice'
        ) {

          const options =
            Array.isArray(
              question.options
            )
              ? question.options
              : [];


          return `
            <div
              class="question"
              data-question-index="${index}">

              <div class="question-label">

                ${esc(question.label)}
                ${requiredMark}

              </div>

              <div class="choice-list">

                ${options
                  .map(
                    option => `
                      <label class="choice">

                        <input
                          type="checkbox"
                          value="${esc(option)}"
                          data-question-input="${index}">

                        <span>
                          ${esc(option)}
                        </span>

                      </label>
                    `
                  )
                  .join('')}

              </div>

              <div class="error">
                გთხოვთ, აირჩიოთ მინიმუმ ერთი პასუხი.
              </div>

            </div>
          `;
        }


        if (
          question.type ===
          'dropdown'
        ) {

          const options =
            Array.isArray(
              question.options
            )
              ? question.options
              : [];


          return `
            <div
              class="question"
              data-question-index="${index}">

              <label
                class="question-label"
                for="question_${index}">

                ${esc(question.label)}
                ${requiredMark}

              </label>

              <select
                id="question_${index}"
                data-question-input="${index}">

                <option value="">
                  აირჩიეთ
                </option>

                ${options
                  .map(
                    option => `
                      <option
                        value="${esc(option)}">

                        ${esc(option)}

                      </option>
                    `
                  )
                  .join('')}

              </select>

              <div class="error">
                გთხოვთ, აირჩიოთ პასუხი.
              </div>

            </div>
          `;
        }


        return `
          <div
            class="question"
            data-question-index="${index}">

            <label
              class="question-label"
              for="question_${index}">

              ${esc(question.label)}
              ${requiredMark}

            </label>

            <input
              id="question_${index}"
              type="text"
              autocomplete="off"
              data-question-input="${index}"
              placeholder="${esc(
                question.placeholder ||
                ''
              )}">

            <div class="error">
              გთხოვთ, შეავსოთ ეს ველი.
            </div>

          </div>
        `;
      }


      function readAnswer(
        question,
        index
      ) {

        if (
          question.type ===
          'multiple_choice'
        ) {

          return [
            ...document.querySelectorAll(
              `[data-question-input="${index}"]:checked`
            )
          ].map(
            input =>
              input.value
          );

        }


        if (
          question.type ===
          'single_choice'
        ) {

          return (
            document.querySelector(
              `[data-question-input="${index}"]:checked`
            )?.value ||
            ''
          );

        }


        return (
          document.querySelector(
            `[data-question-input="${index}"]`
          )?.value ??
          ''
        );

      }


      function answerIsValid(
        question,
        answer
      ) {

        if (
          question.required !== true
        ) {
          return true;
        }


        if (
          Array.isArray(
            answer
          )
        ) {

          return (
            answer.length >
            0
          );

        }


        return (
          String(
            answer ??
            ''
          ).trim() !== ''
        );

      }


      function render(
        exp
      ) {

        const participantInfo =
          exp.config?.participant_info ||
          {};


        const questions =
          Array.isArray(
            participantInfo.questions
          )
            ? participantInfo.questions
                .filter(
                  question =>
                    String(
                      question?.label ||
                      ''
                    ).trim()
                )
            : [];


        if (
          participantInfo.enabled !== true ||
          questions.length === 0
        ) {

          location.replace(
            `run.html?exp=${encodeURIComponent(
              exp.slug
            )}&consent=1`
          );

          return;
        }


        document.title =
          `${
            participantInfo.title ||
            'Participant Information'
          } | CogExperiments`;


        app.innerHTML = `
          <div class="page">

            <div class="shell">

              <a
                class="back-link"
                href="consent.html?exp=${encodeURIComponent(
                  exp.slug
                )}">

                ← თანხმობის გვერდზე დაბრუნება

              </a>


              <div class="eyebrow">
                PARTICIPANT INFORMATION
              </div>


              <h1>
                ${esc(
                  participantInfo.title ||
                  'მონაწილის ინფორმაცია'
                )}
              </h1>


              ${
                participantInfo.introduction
                  ? `
                    <p class="intro">
                      ${esc(
                        participantInfo.introduction
                      )}
                    </p>
                  `
                  : ''
              }


              <section class="form-card">

                <div class="study-block">

                  <div class="study-label">
                    STUDY
                  </div>

                  <h2>
                    ${esc(exp.name)}
                  </h2>

                </div>


                <form
                  id="participantForm"
                  novalidate>

                  ${questions
                    .map(
                      (
                        question,
                        index
                      ) =>
                        renderQuestion(
                          question,
                          index
                        )
                    )
                    .join('')}


                  <div class="actions">

                    <a
                      class="leave-link"
                      href="research.html">

                      კვლევის დატოვება

                    </a>


                    <button
                      class="continue-btn"
                      type="submit">

                      ექსპერიმენტზე გადასვლა →

                    </button>

                  </div>

                </form>

              </section>

            </div>

          </div>
        `;


        const form =
          document.getElementById(
            'participantForm'
          );


        form.addEventListener(
          'submit',
          event => {

            event.preventDefault();


            const answers =
              {};


            let formIsValid =
              true;


            questions.forEach(
              (
                question,
                index
              ) => {

                const answer =
                  readAnswer(
                    question,
                    index
                  );


                const valid =
                  answerIsValid(
                    question,
                    answer
                  );


                const questionBox =
                  document.querySelector(
                    `[data-question-index="${index}"]`
                  );


                questionBox
                  ?.classList
                  .toggle(
                    'invalid',
                    !valid
                  );


                if (
                  !valid
                ) {

                  formIsValid =
                    false;

                }


                const questionId =
                  question.id ||
                  `question_${index + 1}`;


                answers[
                  questionId
                ] = {

                  question_id:
                    questionId,

                  label:
                    question.label ||
                    '',

                  type:
                    question.type ||
                    'short_text',

                  answer
                };

              }
            );


            if (
              !formIsValid
            ) {

              document
                .querySelector(
                  '.question.invalid'
                )
                ?.scrollIntoView({
                  behavior: 'smooth',
                  block: 'center'
                });

              return;
            }


            const participantData =
              {
                experiment_id:
                  exp.id,

                experiment_version:
                  exp.version,

                experiment_slug:
                  exp.slug,

                submitted_at:
                  new Date()
                    .toISOString(),

                answers
              };


            sessionStorage.setItem(
              `cogexperiments-participant-${exp.slug}`,
              JSON.stringify(
                participantData
              )
            );


            location.href =
              `run.html?exp=${encodeURIComponent(
                exp.slug
              )}&consent=1`;

          }
        );

      }


      async function boot() {

        if (
          !slug
        ) {

          app.innerHTML = `
            <div class="page-error">
              კვლევის ბმული არასწორია.
            </div>
          `;

          return;
        }


        try {

          if (
            !window.CogDB
          ) {

            throw new Error(
              'CogDB ვერ ჩაიტვირთა.'
            );

          }


          if (
            typeof CogDB
              .experimentBySlug !==
            'function'
          ) {

            throw new Error(
              'experimentBySlug ფუნქცია ვერ მოიძებნა.'
            );

          }


          const exp =
            await CogDB
              .experimentBySlug(
                slug
              );


          if (
            !exp
          ) {

            app.innerHTML = `
              <div class="page-error">
                კვლევა ვერ მოიძებნა.
              </div>
            `;

            return;
          }


          render(
            exp
          );

        }

        catch (
          error
        ) {

          console.error(
            'Participant page error:',
            error
          );


          app.innerHTML = `
            <div class="page-error">

              <b>
                მონაწილის ინფორმაციის გვერდის ჩატვირთვა ვერ მოხერხდა.
              </b>

              <br><br>

              ${esc(
                error?.message ||
                error
              )}

            </div>
          `;

        }
      }


      boot();

    })();
  </script>

</body>

</html>
